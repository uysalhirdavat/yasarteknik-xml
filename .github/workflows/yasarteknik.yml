name: Yasar Teknik XML

on:
  workflow_dispatch:

concurrency:
  group: yasarteknik-xml
  cancel-in-progress: false

jobs:
  update-xml:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    permissions:
      contents: write

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: En guncel main dalini al
        shell: bash
        run: |
          set -e

          git fetch origin main
          git checkout main
          git reset --hard origin/main

          echo "Calisma baslangic commit:"
          git log -1 --oneline

          if [ -f yasarteknik_partial.json ]; then
            echo "Partial dosyasi bulundu."
            python - <<'PY'
          import json

          with open("yasarteknik_partial.json", "r", encoding="utf-8") as f:
              veri = json.load(f)

          print("Baslangictaki hazir urun sayisi:", len(veri))
          PY
          else
            echo "Partial dosyasi yok."
          fi

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerekli kutuphaneleri yukle
        run: pip install requests beautifulsoup4

      - name: Yasar Teknik XML parcali guncelle
        id: yasar_python
        continue-on-error: true
        env:
          YASAR_KULLANICI_ADI: ${{ secrets.YASAR_KULLANICI_ADI }}
          YASAR_KULLANICI_KODU: ${{ secrets.YASAR_KULLANICI_KODU }}
          YASAR_SIFRE: ${{ secrets.YASAR_SIFRE }}
          YASAR_CHUNK_SIZE: "1200"
        run: python yasarteknik_update.py

      - name: XML ve ilerlemeyi GitHub'a kaydet
        if: always()
        shell: bash
        run: |
          set -e

          git config user.name "yasarteknik-bot"
          git config user.email "actions@github.com"

          mkdir -p /tmp/yasar-save

          if [ -f yasarteknik_partial.json ]; then
            cp yasarteknik_partial.json /tmp/yasar-save/yasarteknik_partial.json
          fi

          if [ -f barkod_map.json ]; then
            cp barkod_map.json /tmp/yasar-save/barkod_map.json
          fi

          if [ -f yasarteknik.xml ]; then
            cp yasarteknik.xml /tmp/yasar-save/yasarteknik.xml
          fi

          git fetch origin main
          git reset --hard origin/main

          if [ -f /tmp/yasar-save/yasarteknik_partial.json ]; then
            cp /tmp/yasar-save/yasarteknik_partial.json yasarteknik_partial.json
          else
            rm -f yasarteknik_partial.json
          fi

          if [ -f /tmp/yasar-save/barkod_map.json ]; then
            cp /tmp/yasar-save/barkod_map.json barkod_map.json
          fi

          if [ -f /tmp/yasar-save/yasarteknik.xml ]; then
            cp /tmp/yasar-save/yasarteknik.xml yasarteknik.xml
          fi

          git add -A -- yasarteknik.xml barkod_map.json yasarteknik_partial.json

          if git diff --cached --quiet; then
            echo "Degisiklik yok."
          else
            git commit -m "Yasar Teknik parcali XML guncelleme"
            git push origin main
          fi

      - name: Python sonucunu kontrol et
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.yasar_python.outcome }}" != "success" ]; then
            echo "Python islemi hata verdi. Partial ilerleme GitHub'a kaydedildi."
            exit 1
          fi

          echo "Python islemi basarili."

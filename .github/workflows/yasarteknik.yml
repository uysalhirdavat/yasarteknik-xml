name: Yasar Teknik XML

on:
  workflow_dispatch:

concurrency:
  group: yasarteknik-xml
  cancel-in-progress: false

jobs:
  update-xml:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    permissions:
      contents: write

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerekli kutuphaneleri yukle
        run: pip install requests beautifulsoup4

      - name: Yasar Teknik XML parcali guncelle
        env:
          YASAR_KULLANICI_ADI: ${{ secrets.YASAR_KULLANICI_ADI }}
          YASAR_KULLANICI_KODU: ${{ secrets.YASAR_KULLANICI_KODU }}
          YASAR_SIFRE: ${{ secrets.YASAR_SIFRE }}
          YASAR_CHUNK_SIZE: "1200"
        run: python yasarteknik_update.py

      - name: XML ve ilerlemeyi GitHub'a kaydet
        run: |
          git config user.name "yasarteknik-bot"
          git config user.email "actions@github.com"

          git add -A -- yasarteknik.xml barkod_map.json yasarteknik_partial.json

          if git diff --cached --quiet; then
            echo "Degisiklik yok."
          else
            git commit -m "Yasar Teknik parcali XML guncelleme"
            git push
          fi

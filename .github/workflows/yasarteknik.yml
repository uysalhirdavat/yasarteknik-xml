name: Yasar Teknik XML

on:
  workflow_dispatch:

jobs:
  update-xml:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerekli kutuphaneleri yukle
        run: pip install requests beautifulsoup4

      - name: Yasar Teknik XML olustur
        env:
          YASAR_KULLANICI_ADI: ${{ secrets.YASAR_KULLANICI_ADI }}
          YASAR_KULLANICI_KODU: ${{ secrets.YASAR_KULLANICI_KODU }}
          YASAR_SIFRE: ${{ secrets.YASAR_SIFRE }}
        run: python yasarteknik_update.py

      - name: XML degisikligini GitHub'a kaydet
        run: |
          git config user.name "yasarteknik-bot"
          git config user.email "actions@github.com"

          git add yasarteknik.xml

          if git diff --cached --quiet; then
            echo "XML'de degisiklik yok."
          else
            git commit -m "Yasar Teknik XML otomatik guncelleme"
            git push
          fi

name: Yasar Teknik XML

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron UTC kullanir.
    # 06:00 UTC = 09:00 Turkiye
    # 15:00 UTC = 18:00 Turkiye
    - cron: "0 6,15 * * *"

concurrency:
  group: yasarteknik-xml
  cancel-in-progress: false

jobs:
  update-xml:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    permissions:
      contents: write

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: En guncel main dalini al
        shell: bash
        run: |
          set -e
          git fetch origin main
          git checkout main
          git reset --hard origin/main

          echo "Calisma baslangic commit:"
          git log -1 --oneline

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerekli kutuphaneleri yukle
        run: pip install requests beautifulsoup4

      - name: Yasar Teknik tum katalogu guncelle
        env:
          YASAR_KULLANICI_ADI: ${{ secrets.YASAR_KULLANICI_ADI }}
          YASAR_KULLANICI_KODU: ${{ secrets.YASAR_KULLANICI_KODU }}
          YASAR_SIFRE: ${{ secrets.YASAR_SIFRE }}
        run: python yasarteknik_update.py

      - name: XML ve barkod haritasini GitHub'a kaydet
        shell: bash
        run: |
          set -e

          git config user.name "yasarteknik-bot"
          git config user.email "actions@github.com"

          mkdir -p /tmp/yasar-save
          cp yasarteknik.xml /tmp/yasar-save/yasarteknik.xml
          cp barkod_map.json /tmp/yasar-save/barkod_map.json

          git fetch origin main
          git reset --hard origin/main

          cp /tmp/yasar-save/yasarteknik.xml yasarteknik.xml
          cp /tmp/yasar-save/barkod_map.json barkod_map.json

          git add -- yasarteknik.xml barkod_map.json

          if git diff --cached --quiet; then
            echo "Degisiklik yok."
          else
            git commit -m "Yasar Teknik XML guncelleme"
            git push origin main
          fi
